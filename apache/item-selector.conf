# Скопировать в /etc/apache2/sites-available/item-selector.conf
# Node должен уже слушать 127.0.0.1:3001 (npm start)

<VirtualHost *:80>
	ServerName localhost

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyPass / http://127.0.0.1:3001/
	ProxyPassReverse / http://127.0.0.1:3001/

	ErrorLog ${APACHE_LOG_DIR}/item-selector-error.log
	CustomLog ${APACHE_LOG_DIR}/item-selector-access.log combined
</VirtualHost>
